[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-wordnet-plugin"
dynamic = ["version"]
description = "OVOS WordNet plugin — dictionary definitions and lexical relations"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "ovos-utils>=0.7.0,<1.0.0",
    "ovos-plugin-manager>=2.3.0a1,<3.0.0",
    "wn>=0.9",
    "pydantic",
    # wn depends on httpx with no upper bound; under this org's CI-wide
    # UV_PRERELEASE=allow (needed for ovos-plugin-manager alphas), the
    # resolver otherwise picks httpx==1.0.dev3 — a dev-only PyPI upload
    # that ships with NO license metadata at all (license/license_expression
    # both null, no License classifiers; confirmed via PyPI JSON API), which
    # fails the license-check job as "Error", not a real GPL-class license.
    # httpx itself is BSD-3-Clause. Pin below the 1.0 dev line to keep
    # resolution on a released, metadata-complete version.
    "httpx>=0.27,<1.0.dev0",
    "simplematch",
]

[project.entry-points."opm.agents.retrieval"]
ovos-wordnet-plugin = "ovos_wordnet_plugin:WordnetRetrievalEngine"

[project.entry-points."opm.agents.toolbox"]
ovos-wordnet-tools = "ovos_wordnet_plugin:WordnetToolbox"

[tool.setuptools.dynamic]
version = {attr = "ovos_wordnet_plugin.version.__version__"}
